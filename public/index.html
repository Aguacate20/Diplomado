<body>
<title>Laboratorio de Evidencias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: top bar + sidebar (expedientes / datos / referencia) + notebook. Case-file aesthetic: ink navy, paper grey, evidence-tape amber. */
:root {
  --bg: #eef0f3; --surface: #ffffff; --surface2: #f4f6f9; --ink: #1b2430; --muted: #5c6b73; --line: #d7dde4;
  --accent: #1f5fa8; --accent-ink: #ffffff; --tape: #d9822b; --ok: #2a9d8f; --danger: #c0392b; --warn: #b7791f;
  --code-bg: #f7f8fa; --kw: #7b2f8e; --str: #1f6f3f; --num: #b45309; --fn: #1f5fa8; --cm: #8a94a0;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", Consolas, "Courier New", monospace; --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 14px rgba(20, 30, 50, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12161c; --surface: #1a2029; --surface2: #222a35; --ink: #e8ecf1; --muted: #9aa7b4; --line: #2e3844; --accent: #6ea4e8; --accent-ink: #0d1420; --tape: #e9a35a; --ok: #4fc3b4; --danger: #e5706b; --warn: #d9a441; --code-bg: #141a22; --kw: #d49ae6; --str: #8fd39f; --num: #f0b06a; --fn: #8fbcf0; --cm: #6c7786; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #12161c; --surface: #1a2029; --surface2: #222a35; --ink: #e8ecf1; --muted: #9aa7b4; --line: #2e3844; --accent: #6ea4e8; --accent-ink: #0d1420; --tape: #e9a35a; --ok: #4fc3b4; --danger: #e5706b; --warn: #d9a441; --code-bg: #141a22; --kw: #d49ae6; --str: #8fd39f; --num: #f0b06a; --fn: #8fbcf0; --cm: #6c7786; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35); color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; margin: 0; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 30px; height: 30px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .5px; }
.brand h1 { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: .3px; margin: 0; line-height: 1; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-family: var(--font); margin-top: 2px; }
.topbar .spacer { flex: 1; }
.sesion-select { display: flex; gap: 4px; flex-wrap: wrap; }
.sesion-select button { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.sesion-select button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface2); } .btn:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.main { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 0; }
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 10px 6px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tape); }
.panel { overflow: auto; padding: 14px; flex: 1; min-height: 0; }
.ses-head { padding: 10px 12px; border-radius: 8px; background: var(--surface2); margin-bottom: 12px; border-left: 4px solid var(--ses, var(--accent)); }
.ses-head .n { font-family: var(--display); color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.ses-head h2 { margin: 2px 0 2px; font-size: 20px; font-family: var(--display); font-weight: 700; }
.ses-head p { margin: 0; color: var(--muted); font-size: 13px; }
.mision { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; background: var(--surface); overflow: hidden; }
.mision > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; gap: 10px; align-items: baseline; }
.mision > summary::-webkit-details-marker { display: none; }
.mision .tag { font-family: var(--display); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--tape); white-space: nowrap; }
.mision .tt { font-weight: 600; flex: 1; }
.mision .done { color: var(--ok); font-size: 13px; }
.mision .body { padding: 0 12px 12px; font-size: 14px; }
.mision .body p { margin: 6px 0; }
.mision .hip { background: var(--surface2); border-left: 3px solid var(--tape); padding: 8px 10px; border-radius: 0 6px 6px 0; margin: 8px 0; }
.mision .hip b { font-family: var(--display); letter-spacing: .5px; text-transform: uppercase; font-size: 12px; color: var(--muted); display: block; }
.pista { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px dashed var(--line); }
.pista .k { font-family: var(--display); font-weight: 700; color: var(--muted); min-width: 22px; }
.pista .t { flex: 1; }
.pista button { white-space: nowrap; }
.veredicto textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; font-size: 13px; background: var(--surface2); color: var(--ink); resize: vertical; }
.veredicto label { font-family: var(--display); letter-spacing: .5px; text-transform: uppercase; font-size: 12px; color: var(--muted); display: block; margin-top: 8px; }
.concepto { font-size: 12px; color: var(--muted); margin-top: 4px; }
.ds { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; background: var(--surface); }
.ds > summary { list-style: none; cursor: pointer; padding: 10px 12px; }
.ds > summary::-webkit-details-marker { display: none; }
.ds code, .ref code { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.ds .desc { color: var(--muted); font-size: 13px; padding: 0 12px 6px; }
.ds table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ds td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.ds td:first-child { font-family: var(--mono); white-space: nowrap; cursor: pointer; color: var(--fn); }
.ds td:first-child:hover { text-decoration: underline; }
.ds .ty { color: var(--muted); white-space: nowrap; }
.ref h4 { margin: 14px 0 6px; font-family: var(--display); letter-spacing: .5px; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.ref .item { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13px; }
.ref .item code { cursor: pointer; }
.ref .item code:hover { outline: 1px solid var(--accent); }
.ref .item span { color: var(--muted); }
.notebook { overflow: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 60px 16px; min-width: 0; }
.nb-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.nb-head .status { color: var(--muted); font-size: 13px; }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; box-shadow: var(--shadow); min-width: 0; }
.cell.active { border-color: var(--accent); }
.cell-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--surface2); border-radius: 8px 8px 0 0; flex-wrap: wrap; }
.cell-bar .num { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 48px; }
.cell-bar .spacer { flex: 1; }
.editor { position: relative; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; background: var(--code-bg); border-radius: 0 0 8px 8px; }
.editor pre, .editor textarea { margin: 0; padding: 10px 12px; font: inherit; white-space: pre-wrap; word-wrap: break-word; tab-size: 4; min-height: 46px; }
.editor pre { position: absolute; inset: 0; pointer-events: none; color: var(--ink); overflow: hidden; }
.editor textarea { position: relative; width: 100%; display: block; background: transparent; color: transparent; caret-color: var(--ink); border: 0; resize: none; overflow: hidden; outline: none; border-radius: 0 0 8px 8px; }
.editor textarea::selection { background: rgba(31, 95, 168, .25); }
.editor .kw { color: var(--kw); } .editor .str { color: var(--str); } .editor .num { color: var(--num); } .editor .fn { color: var(--fn); } .editor .cm { color: var(--cm); font-style: italic; }
.out { border-top: 1px solid var(--line); padding: 10px 12px; overflow-x: auto; }
.out:empty { display: none; }
.out pre { margin: 0; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; }
.out .print { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; margin: 0 0 6px; }
.tbl-wrap { overflow-x: auto; }
table.df { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.df th, table.df td { padding: 4px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.df th { font-weight: 600; background: var(--surface2); position: sticky; top: 0; }
table.df td.idx, table.df th.idx { text-align: left; color: var(--muted); font-weight: 500; }
table.df td.txt { text-align: left; }
.caption { color: var(--muted); font-size: 12.5px; margin: 6px 0 2px; display: flex; gap: 10px; align-items: center; }
.err { border-left: 4px solid var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); padding: 8px 12px; border-radius: 0 6px 6px 0; }
.err b { color: var(--danger); }
.err .hint { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.stat { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat .st-title { background: var(--surface2); padding: 8px 12px; font-weight: 600; font-family: var(--display); font-size: 17px; letter-spacing: .3px; }
.stat table.kv { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.stat table.kv td { padding: 5px 12px; border-top: 1px solid var(--line); }
.stat table.kv td:first-child { color: var(--muted); width: 48%; }
.stat table.kv td:last-child { font-variant-numeric: tabular-nums; font-weight: 500; }
.stat .interp { padding: 10px 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--tape) 10%, var(--surface)); font-size: 14px; }
.stat .interp::before { content: "Cómo leerlo"; display: block; font-family: var(--display); letter-spacing: .6px; text-transform: uppercase; font-size: 12px; color: var(--tape); margin-bottom: 2px; }
.stat .extra { padding: 8px 12px; border-top: 1px solid var(--line); }
.fig { max-width: 760px; }
.fig svg { display: block; max-width: 100%; height: auto; }
.fig-note { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.chart .ct-title { font: 600 15px var(--font); fill: var(--ink); }
.chart .ct-tick { font: 11.5px var(--font); fill: var(--muted); }
.chart .ct-val { font: 11px var(--font); fill: var(--ink); }
.chart .ct-cell { font: 11px var(--font); }
.chart .ct-label { font: 500 12px var(--font); fill: var(--muted); }
.chart .ct-grid { stroke: var(--line); stroke-width: 1; }
.chart .ct-axis { stroke: var(--muted); stroke-width: 1; }
.ai { border-top: 1px solid var(--line); padding: 10px 12px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); font-size: 14px; }
.ai .ai-head { font-family: var(--display); letter-spacing: .6px; text-transform: uppercase; font-size: 12px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
.ai .ai-body { white-space: pre-wrap; margin-top: 4px; }
.ai .ai-body code { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
.ai pre.code { background: var(--code-bg); padding: 8px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; margin: 6px 0; border: 1px solid var(--line); }
.ask { display: flex; gap: 6px; margin-top: 8px; }
.ask input { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); min-width: 0; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.chat .msg { padding: 8px 10px; border-radius: 8px; font-size: 13.5px; white-space: pre-wrap; }
.chat .msg.u { background: var(--surface2); align-self: flex-end; max-width: 92%; }
.chat .msg.a { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.chat .msg pre.code { background: var(--code-bg); padding: 8px; border-radius: 6px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; border: 1px solid var(--line); margin: 6px 0; }
.notice { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); padding: 8px 12px; border-radius: 6px; font-size: 13.5px; margin-bottom: 12px; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.kbd { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.side-toggle { display: none; }
@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 46vh; }
  .side.collapsed .tabs, .side.collapsed .panel { display: none; }
  .side-toggle { display: inline-flex; }
  .notebook { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: no-preference) { .cell { transition: border-color .15s; } }
/* Expedientes «pensar antes de insertar» (sesión 3) */
.intro-exp { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.gate { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: var(--surface); }
.gate.pred { border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.gate .gt, .vered-box .gt { font-family: var(--display); letter-spacing: .5px; text-transform: uppercase; font-size: 12px; color: var(--muted); }
.gate .gq, .vered-box .gq { font-weight: 600; margin: 2px 0 6px; font-size: 13.5px; }
.gate .chosen { font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.opts label { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; cursor: pointer; padding: 4px 6px; border-radius: 6px; line-height: 1.35; }
.opts label:hover { background: var(--surface2); }

.opts input { margin-top: 2px; accent-color: var(--accent); flex: none; }

.fb.ok { background: color-mix(in srgb, var(--ok) 12%, var(--surface)); border-left: 3px solid var(--ok); }

.paso { border-top: 1px dashed var(--line); padding: 8px 0 4px; }
.paso .ph { display: flex; gap: 8px; align-items: baseline; }
.paso .ph .k { font-family: var(--display); font-weight: 700; color: var(--tape); min-width: 18px; }

.paso .ph .ok { color: var(--ok); font-weight: 600; }

.paso.locked .ph .k { color: var(--muted); }
.paso .inner { margin-left: 26px; }
.paso .tools { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 0; }
.pista-txt { font-size: 13px; background: var(--surface2); border-radius: 6px; padding: 6px 9px; margin: 6px 0; line-height: 1.4; }
.cer-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.gate input[type="text"], .gate textarea { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; background: var(--surface2); color: var(--ink); }
.cer-row input { width: 120px; }
.gate.dato input[type="text"] { width: 100%; margin-bottom: 6px; }
.gate textarea { width: 100%; min-height: 54px; resize: vertical; margin-bottom: 6px; display: block; }
.small-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
.vered-box { border-top: 2px solid var(--tape); margin-top: 10px; padding-top: 8px; }
.vered-box.locked { opacity: .7; }
.acciones { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
.vered-box .opts label { font-family: var(--font); text-transform: none; letter-spacing: normal; font-size: 13.5px; color: var(--ink); margin-top: 0; display: flex; }
.ai-code-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.ai-code-head .btn { margin: 0; }
.ia-badge { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }

.ia-estado { font-size: 12.5px; color: var(--muted); margin-top: 8px; font-style: italic; }
</style>

  <header class="topbar">

<script>
/* ===================== Mini-Python: tokenizer + parser ===================== */
class LabError extends Error { constructor(msg, hint) { super(msg); this.hint = hint; } }

const KEYWORDS = new Set(["True", "False", "None", "and", "or", "not", "in", "is", "for", "if", "else", "import", "as", "from", "def", "lambda", "while", "return"]);

function tokenize(src) {
  const toks = []; let i = 0; let depth = 0; let line = 1; let fpend = false;
  const push = (t, v) => toks.push({ t, v, line });
  while (i < src.length) {
    const c = src[i];
    if (c === "\n") { line++; if (depth === 0) push("NL", "\n"); i++; continue; }
    if (c === " " || c === "\t" || c === "\r") { i++; continue; }
    if (c === "\\" && src[i + 1] === "\n") { i += 2; line++; continue; }
    if (c === "#") { while (i < src.length && src[i] !== "\n") i++; continue; }
    if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
      let j = i; while (j < src.length && /[0-9_.eE]/.test(src[j]) && !(src[j] === "e" && !/[0-9.]/.test(src[j - 1]))) { if ((src[j] === "e" || src[j] === "E") && (src[j + 1] === "-" || src[j + 1] === "+")) j++; j++; }
      const txt = src.slice(i, j).replace(/_/g, "");
      push("NUM", Number(txt)); i = j; continue;
    }
    if (c === '"' || c === "'") {
      const triple = src.slice(i, i + 3) === c.repeat(3);
      const q = triple ? c.repeat(3) : c; let j = i + q.length; let s = "";
      while (j < src.length && src.slice(j, j + q.length) !== q) {
        if (src[j] === "\\") { const n = src[j + 1]; s += n === "n" ? "\n" : n === "t" ? "\t" : n; j += 2; continue; }
        if (src[j] === "\n" && !triple) throw new LabError(`Cadena de texto sin cerrar en la línea ${line}.`, "Revisa que cada comilla de apertura tenga su comilla de cierre.");
        s += src[j]; j++;
      }
      if (j >= src.length) throw new LabError(`Cadena de texto sin cerrar en la línea ${line}.`, "Revisa que cada comilla de apertura tenga su comilla de cierre.");
      push(fpend ? "FSTR" : "STR", s); fpend = false; i = j + q.length; continue;
    }
    if (/[A-Za-z_À-ɏ]/.test(c)) {
      let j = i; while (j < src.length && /[A-Za-z0-9_À-ɏ]/.test(src[j])) j++;
      let w = src.slice(i, j);
      if (/^[fFrRbB]{1,2}$/.test(w) && (src[j] === '"' || src[j] === "'")) { fpend = /f/i.test(w); i = j; continue; }
      push(KEYWORDS.has(w) ? "KW" : "NAME", w); i = j; continue;
    }
    const three = src.slice(i, i + 3), two = src.slice(i, i + 2);
    if (["**=", "//="].includes(three)) { push("OP", three); i += 3; continue; }
    if (["==", "!=", "<=", ">=", "**", "//", "+=", "-=", "*=", "/=", "->"].includes(two)) { push("OP", two); i += 2; continue; }
    if ("([{".includes(c)) depth++; if (")]}".includes(c)) depth--;
    if ("+-*/%=<>&|~^()[]{},:.;".includes(c)) { push("OP", c); i++; continue; }
    throw new LabError(`No reconozco el símbolo «${c}» en la línea ${line}.`, "Python usa comillas rectas (\" o '), no tipográficas (“ ”). Revisa también los acentos en nombres.");
  }
  push("NL", "\n"); push("EOF", null);
  return toks;
}

class Parser {
  constructor(toks) { this.toks = toks; this.p = 0; }
  peek(o = 0) { return this.toks[this.p + o]; }
  next() { return this.toks[this.p++]; }
  at(t, v) { const k = this.peek(); return k.t === t && (v === undefined || k.v === v); }
  eat(t, v) { if (this.at(t, v)) return this.next(); return null; }
  expect(t, v, what) {
    const k = this.peek();
    if (this.at(t, v)) return this.next();
    const got = k.t === "EOF" || k.t === "NL" ? "el final de la línea" : `«${k.v}»`;
    throw new LabError(`Esperaba ${what || v || t} pero encontré ${got} (línea ${k.line}).`, "Revisa paréntesis, corchetes y comas.");
  }
  parseProgram() {
    const stmts = [];
    while (!this.at("EOF")) {
      if (this.eat("NL") || this.eat("OP", ";")) continue;
      stmts.push(this.parseStatement());
      if (!this.at("EOF")) { if (!this.eat("NL") && !this.eat("OP", ";")) { const k = this.peek(); throw new LabError(`No esperaba «${k.v}» aquí (línea ${k.line}).`, "¿Falta una coma, un paréntesis o un operador?"); } }
    }
    return stmts;
  }
  parseStatement() {
    const k = this.peek();
    if (k.t === "KW" && (k.v === "import" || k.v === "from")) { // import pandas as pd -> ignore
      const ws = []; while (!this.at("NL") && !this.at("EOF")) ws.push(this.next().v);
      return { type: "import", line: k.line, mod: String(ws[1] || "") };
    }
    if (k.t === "KW" && ["for", "if", "while", "def", "lambda", "return"].includes(k.v)) {
      throw new LabError(`En este laboratorio no usamos «${k.v}»: todo se resuelve con operaciones de pandas sobre tablas completas.`, "Prueba con filtros (df[df[\"col\"] == valor]), groupby o value_counts.");
    }
    let expr = this.parseExpr();
    if (this.at("OP", ",")) { const items = [expr]; while (this.eat("OP", ",")) { if (this.at("NL") || this.at("EOF")) break; items.push(this.parseExpr()); } expr = { type: "tuple", items }; }
    const op = this.peek();
    if (op.t === "OP" && ["=", "+=", "-=", "*=", "/="].includes(op.v)) {
      this.next();
      const value = this.parseExpr();
      if (expr.type !== "name" && expr.type !== "index" && expr.type !== "attr") throw new LabError(`No se puede asignar a esa expresión (línea ${op.line}).`, "A la izquierda del = va un nombre, p. ej. tabla = ...");
      return { type: "assign", target: expr, op: op.v, value, line: op.line };
    }
    return { type: "expr", expr, line: k.line };
  }
  parseExpr() { return this.parseTernary(); }
  parseTernary() {
    const e = this.parseOr();
    if (this.at("KW", "if")) { this.next(); const cond = this.parseOr(); this.expect("KW", "else", "else"); const other = this.parseTernary(); return { type: "ternary", cond, a: e, b: other }; }
    return e;
  }
  parseOr() { let l = this.parseAnd(); while (this.at("KW", "or")) { this.next(); l = { type: "logic", op: "or", l, r: this.parseAnd() }; } return l; }
  parseAnd() { let l = this.parseNot(); while (this.at("KW", "and")) { this.next(); l = { type: "logic", op: "and", l, r: this.parseNot() }; } return l; }
  parseNot() { if (this.at("KW", "not")) { this.next(); return { type: "unary", op: "not", e: this.parseNot() }; } return this.parseCompare(); }
  parseCompare() {
    let l = this.parseBitOr();
    for (;;) {
      const k = this.peek();
      if (k.t === "OP" && ["==", "!=", "<", ">", "<=", ">="].includes(k.v)) { this.next(); l = { type: "binop", op: k.v, l, r: this.parseBitOr(), line: k.line }; continue; }
      if (k.t === "KW" && k.v === "in") { this.next(); l = { type: "binop", op: "in", l, r: this.parseBitOr(), line: k.line }; continue; }
      if (k.t === "KW" && k.v === "not" && this.peek(1).t === "KW" && this.peek(1).v === "in") { this.next(); this.next(); l = { type: "binop", op: "not in", l, r: this.parseBitOr(), line: k.line }; continue; }
      if (k.t === "KW" && k.v === "is") { this.next(); let neg = false; if (this.at("KW", "not")) { this.next(); neg = true; } l = { type: "binop", op: neg ? "!=" : "==", l, r: this.parseBitOr(), line: k.line }; continue; }
      return l;
    }
  }
  parseBitOr() { let l = this.parseBitAnd(); while (this.at("OP", "|")) { const k = this.next(); l = { type: "binop", op: "|", l, r: this.parseBitAnd(), line: k.line }; } return l; }
  parseBitAnd() { let l = this.parseAdd(); while (this.at("OP", "&")) { const k = this.next(); l = { type: "binop", op: "&", l, r: this.parseAdd(), line: k.line }; } return l; }
  parseAdd() { let l = this.parseMul(); while (this.at("OP", "+") || this.at("OP", "-")) { const k = this.next(); l = { type: "binop", op: k.v, l, r: this.parseMul(), line: k.line }; } return l; }
  parseMul() { let l = this.parseUnary(); while (this.at("OP", "*") || this.at("OP", "/") || this.at("OP", "%") || this.at("OP", "//")) { const k = this.next(); l = { type: "binop", op: k.v, l, r: this.parseUnary(), line: k.line }; } return l; }
  parseUnary() {
    if (this.at("OP", "-")) { this.next(); return { type: "unary", op: "-", e: this.parseUnary() }; }
    if (this.at("OP", "+")) { this.next(); return this.parseUnary(); }
    if (this.at("OP", "~")) { this.next(); return { type: "unary", op: "~", e: this.parseUnary() }; }
    return this.parsePower();
  }
  parsePower() { const b = this.parsePostfix(); if (this.at("OP", "**")) { this.next(); return { type: "binop", op: "**", l: b, r: this.parseUnary() }; } return b; }
  parsePostfix() {
    let e = this.parsePrimary();
    for (;;) {
      if (this.at("OP", ".")) { this.next(); const n = this.expect("NAME", undefined, "un nombre después del punto"); e = { type: "attr", obj: e, name: n.v, line: n.line }; continue; }
      if (this.at("OP", "(")) { const k = this.next(); const { args, kwargs } = this.parseArgs(); e = { type: "call", fn: e, args, kwargs, line: k.line }; continue; }
      if (this.at("OP", "[")) { const k = this.next(); const idx = this.parseSubscript(); this.expect("OP", "]", "el corchete de cierre ]"); e = { type: "index", obj: e, idx, line: k.line }; continue; }
      return e;
    }
  }
  parseSubscript() {
    // slice a:b or expression; allow tuple (a, b) for loc
    const parseOne = () => {
      let lo = null, hi = null;
      if (!this.at("OP", ":")) lo = this.parseExpr();
      if (this.at("OP", ":")) { this.next(); if (!this.at("OP", "]") && !this.at("OP", ",")) hi = this.parseExpr(); return { type: "slice", lo, hi }; }
      return lo;
    };
    const first = parseOne();
    if (this.at("OP", ",")) { const items = [first]; while (this.eat("OP", ",")) { if (this.at("OP", "]")) break; items.push(parseOne()); } return { type: "tuple", items }; }
    return first;
  }
  parseArgs() {
    const args = [], kwargs = [];
    while (this.eat("NL")) {}
    if (this.eat("OP", ")")) return { args, kwargs };
    for (;;) {
      while (this.eat("NL")) {}
      if (this.at("NAME") && this.peek(1).t === "OP" && this.peek(1).v === "=") { const n = this.next(); this.next(); kwargs.push({ name: n.v, value: this.parseExpr() }); }
      else args.push(this.parseExpr());
      while (this.eat("NL")) {}
      if (this.eat("OP", ",")) { while (this.eat("NL")) {} if (this.eat("OP", ")")) return { args, kwargs }; continue; }
      this.expect("OP", ")", "el paréntesis de cierre )");
      return { args, kwargs };
    }
  }
  parsePrimary() {
    const k = this.next();
    if (k.t === "NUM") return { type: "num", v: k.v };
    if (k.t === "FSTR" || (k.t === "STR" && this.at("FSTR"))) { const parts = []; let t = k; for (;;) { if (t.t === "FSTR") parts.push(...parseFString(t.v, t.line)); else parts.push(t.v); if (this.at("STR") || this.at("FSTR")) t = this.next(); else break; } return { type: "fstr", parts }; }
    if (k.t === "STR") { let s = k.v; while (this.at("STR")) s += this.next().v; return { type: "str", v: s }; }
    if (k.t === "NAME") return { type: "name", v: k.v, line: k.line };
    if (k.t === "KW") {
      if (k.v === "True") return { type: "const", v: true };
      if (k.v === "False") return { type: "const", v: false };
      if (k.v === "None") return { type: "const", v: null };
      if (k.v === "lambda") throw new LabError("En este laboratorio no usamos lambda.", "Casi todo se logra con value_counts, groupby, crosstab o filtros.");
      throw new LabError(`No esperaba la palabra «${k.v}» aquí (línea ${k.line}).`);
    }
    if (k.t === "OP" && k.v === "(") {
      while (this.eat("NL")) {}
      if (this.eat("OP", ")")) return { type: "tuple", items: [] };
      const e = this.parseExpr();
      if (this.at("OP", ",")) { const items = [e]; while (this.eat("OP", ",")) { while (this.eat("NL")) {} if (this.at("OP", ")")) break; items.push(this.parseExpr()); } this.expect("OP", ")", ")"); return { type: "tuple", items }; }
      while (this.eat("NL")) {}
      this.expect("OP", ")", "el paréntesis de cierre )"); return e;
    }
    if (k.t === "OP" && k.v === "[") {
      const items = []; while (this.eat("NL")) {}
      while (!this.at("OP", "]")) { items.push(this.parseExpr()); while (this.eat("NL")) {} if (!this.eat("OP", ",")) break; while (this.eat("NL")) {} }
      while (this.eat("NL")) {}
      this.expect("OP", "]", "el corchete de cierre ]"); return { type: "list", items };
    }
    if (k.t === "OP" && k.v === "{") {
      const items = []; while (this.eat("NL")) {}
      while (!this.at("OP", "}")) { const key = this.parseExpr(); this.expect("OP", ":", "dos puntos"); const v = this.parseExpr(); items.push([key, v]); while (this.eat("NL")) {} if (!this.eat("OP", ",")) break; while (this.eat("NL")) {} }
      while (this.eat("NL")) {}
      this.expect("OP", "}", "la llave de cierre }"); return { type: "dict", items };
    }
    if (k.t === "NL" || k.t === "EOF") throw new LabError(`La expresión quedó incompleta (línea ${k.line}).`, "¿Falta algo después de un operador o una coma?");
    throw new LabError(`No esperaba «${k.v}» aquí (línea ${k.line}).`, "Revisa paréntesis, corchetes y comas.");
  }
}

function parseProgram(src) { return new Parser(tokenize(src)).parseProgram(); }

/* ===================== DataFrame / Series runtime ===================== */
const isNum = (v) => typeof v === "number" && !Number.isNaN(v);
const isMissing = (v) => v === null || v === undefined || (typeof v === "number" && Number.isNaN(v)) || v === "";
const fmtNum = (v, d) => {
  if (!isNum(v)) return isMissing(v) ? "NaN" : String(v);
  if (Number.isInteger(v)) return Math.abs(v) < 10000 ? String(v) : v.toLocaleString("es-CO");
  const dd = d !== undefined ? d : (Math.abs(v) >= 100 ? 1 : Math.abs(v) >= 1 ? 2 : 4);
  return v.toLocaleString("es-CO", { minimumFractionDigits: 0, maximumFractionDigits: dd });
};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function inferType(values) {
  let n = 0, num = 0, bool = 0;
  for (const v of values) { if (isMissing(v)) continue; n++; if (typeof v === "number") num++; else if (typeof v === "boolean") bool++; }
  if (n === 0) return "texto";
  if (bool === n) return "lógico";
  if (num === n) return values.some((v) => isNum(v) && !Number.isInteger(v)) ? "decimal" : "entero";
  return "texto";
}

class Series {
  constructor(values, { name = null, index = null } = {}) {
    this.values = values; this.name = name; this.index = index || values.map((_, i) => i);
    this._type = null;
  }
  get kind() { return "Series"; }
  get type() { if (!this._type) this._type = inferType(this.values); return this._type; }
  get length() { return this.values.length; }
  numeric() { const out = []; for (const v of this.values) { if (isNum(v)) out.push(v); else if (typeof v === "boolean") out.push(v ? 1 : 0); } return out; }
  isNumeric() { return this.type === "entero" || this.type === "decimal"; }
  map(fn) { return new Series(this.values.map(fn), { name: this.name, index: this.index }); }
  slice(a, b) { return new Series(this.values.slice(a, b), { name: this.name, index: this.index.slice(a, b) }); }
  take(idxs) { return new Series(idxs.map((i) => this.values[i]), { name: this.name, index: idxs.map((i) => this.index[i]) }); }
  head(n = 5) { return this.slice(0, n); }
  tail(n = 5) { return this.slice(Math.max(0, this.length - n)); }
  mean() { const a = this.numeric(); return a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN; }
  sum() { if (this.type === "lógico") return this.values.filter((v) => v === true).length; return this.numeric().reduce((s, v) => s + v, 0); }
  min() { const a = this.numeric(); return a.length ? Math.min(...a) : NaN; }
  max() { const a = this.numeric(); return a.length ? Math.max(...a) : NaN; }
  count() { return this.values.filter((v) => !isMissing(v)).length; }
  median() { return quantile(this.numeric(), 0.5); }
  quantile(q = 0.5) { return quantile(this.numeric(), q); }
  std() { return Math.sqrt(this.var()); }
  var() { const a = this.numeric(); if (a.length < 2) return NaN; const m = a.reduce((s, v) => s + v, 0) / a.length; return a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1); }
  nunique() { return new Set(this.values.filter((v) => !isMissing(v))).size; }
  unique() { const seen = new Set(); const out = []; for (const v of this.values) { const k = isMissing(v) ? "__nan__" : v; if (!seen.has(k)) { seen.add(k); out.push(isMissing(v) ? NaN : v); } } return out; }
  value_counts({ normalize = false, sort = true, ascending = false, dropna = true } = {}) {
    const m = new Map();
    for (const v of this.values) { if (isMissing(v)) { if (dropna) continue; } const k = isMissing(v) ? "NaN" : v; m.set(k, (m.get(k) || 0) + 1); }
    let entries = [...m.entries()];
    if (sort) entries.sort((a, b) => ascending ? a[1] - b[1] : b[1] - a[1]);
    const total = entries.reduce((s, e) => s + e[1], 0);
    return new Series(entries.map((e) => normalize ? e[1] / total : e[1]), { name: normalize ? "proporción" : "conteo", index: entries.map((e) => e[0]) }).withIndexName(this.name);
  }
  withIndexName(n) { this.indexName = n; return this; }
  describe() {
    if (this.isNumeric()) {
      const a = this.numeric();
      return new Series([a.length, this.mean(), this.std(), this.min(), quantile(a, 0.25), quantile(a, 0.5), quantile(a, 0.75), this.max()], { name: this.name, index: ["count", "mean", "std", "min", "25%", "50%", "75%", "max"] });
    }
    const vc = this.value_counts();
    return new Series([this.count(), this.nunique(), vc.index[0], vc.values[0]], { name: this.name, index: ["count", "unique", "top", "freq"] });
  }
  isna() { return this.map((v) => isMissing(v)); }
  notna() { return this.map((v) => !isMissing(v)); }
  fillna(x) { return this.map((v) => isMissing(v) ? x : v); }
  dropna() { const idxs = []; this.values.forEach((v, i) => { if (!isMissing(v)) idxs.push(i); }); return this.take(idxs); }
  isin(list) { const s = new Set(list); return this.map((v) => s.has(v)); }
  between(a, b) { return this.map((v) => isNum(v) && v >= a && v <= b); }
  round(n = 0) { const f = 10 ** n; return this.map((v) => isNum(v) ? Math.round(v * f) / f : v); }
  abs() { return this.map((v) => isNum(v) ? Math.abs(v) : v); }
  astype(t) {
    if (t === "int" || t === "entero") return this.map((v) => isMissing(v) ? NaN : typeof v === "boolean" ? (v ? 1 : 0) : Math.trunc(Number(v)));
    if (t === "float" || t === "decimal") return this.map((v) => isMissing(v) ? NaN : Number(v));
    if (t === "str" || t === "texto" || t === "category") return this.map((v) => isMissing(v) ? v : String(v));
    if (t === "bool") return this.map((v) => !!v && v !== "False");
    throw new LabError(`astype no reconoce el tipo «${t}».`, "Usa \"int\", \"float\" o \"str\".");
  }
  sort_values({ ascending = true } = {}) {
    const idxs = this.values.map((_, i) => i);
    idxs.sort((i, j) => cmp(this.values[i], this.values[j]) * (ascending ? 1 : -1));
    return this.take(idxs);
  }
  sort_index({ ascending = true } = {}) {
    const idxs = this.values.map((_, i) => i);
    idxs.sort((i, j) => cmp(this.index[i], this.index[j]) * (ascending ? 1 : -1));
    return this.take(idxs);
  }
  idxmax() { let b = -1, bv = -Infinity; this.values.forEach((v, i) => { if (isNum(v) && v > bv) { bv = v; b = i; } }); return b >= 0 ? this.index[b] : NaN; }
  idxmin() { let b = -1, bv = Infinity; this.values.forEach((v, i) => { if (isNum(v) && v < bv) { bv = v; b = i; } }); return b >= 0 ? this.index[b] : NaN; }
  cumsum() { let s = 0; return this.map((v) => { if (isNum(v)) s += v; return s; }); }
  diff() { return new Series(this.values.map((v, i) => i === 0 || !isNum(v) || !isNum(this.values[i - 1]) ? NaN : v - this.values[i - 1]), { name: this.name, index: this.index }); }
  shift(n = 1) { return new Series(this.values.map((_, i) => i - n < 0 || i - n >= this.length ? NaN : this.values[i - n]), { name: this.name, index: this.index }); }
  rolling(n) { const s = this; return { kind: "Rolling", n, mean() { return new Series(s.values.map((_, i) => { if (i < n - 1) return NaN; const w = s.values.slice(i - n + 1, i + 1).filter(isNum); return w.length ? w.reduce((a, b) => a + b, 0) / w.length : NaN; }), { name: s.name, index: s.index }); }, sum() { return new Series(s.values.map((_, i) => { if (i < n - 1) return NaN; return s.values.slice(i - n + 1, i + 1).filter(isNum).reduce((a, b) => a + b, 0); }), { name: s.name, index: s.index }); } }; }
  mapDict(d) { const m = d instanceof Map ? d : new Map(Object.entries(d)); return this.map((v) => m.has(String(v)) ? m.get(String(v)) : (m.has(v) ? m.get(v) : NaN)); }
  replace(d) { const m = new Map(Object.entries(d)); return this.map((v) => m.has(String(v)) ? m.get(String(v)) : v); }
  get str() {
    const s = this;
    const S = (fn) => s.map((v) => isMissing(v) ? v : fn(String(v)));
    return {

function numericOf(x, what) {

function variance(a) { const m = mean(a); return a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1); }

function prueba_t(a, b, kw = {}) {

  }

    [[`Media ${na[0]} (n=${nx.toLocaleString("es-CO")})`, fmtNum(mx)], [`Media ${na[1]} (n=${ny.toLocaleString("es-CO")})`, fmtNum(my)], ["Diferencia de medias", fmtNum(mx - my)], ["IC 95 % de la diferencia", `${fmtNum(ci[0])} a ${fmtNum(ci[1])}`], ["t", fmtNum(t, 3)], ["gl", fmtNum(df, 1)], ["valor p", pFmt(p) + " " + sig(p)], ["d de Cohen (tamaño del efecto)", `${fmtNum(d, 2)} (${dLab})`]],

  bogotaPadre: () => { const v = state.data.vif; const ag = new Set(["Padre", "Madre", "Padrastro", "Hermano", "Cuñado", "Hijo"]); const d = v.col("departamento").values, a = v.col("agresor").values; let tot = 0, pad = 0; for (let i = 0; i < d.length; i++) { if (d[i] === "Bogotá, D.C." && ag.has(a[i])) { tot++; if (a[i] === "Padre") pad++; } } return 100 * pad / tot; },
  vichada: () => state.data.vif.col("departamento").values.filter((x) => x === "Vichada").length,
};

function insertCode(code, run = false) {
  const active = state.cells.find((c) => c.el.classList.contains("active"));
  let cell; const vacia = [...state.cells].reverse().find((c) => !c.ta.value.trim()); if (active && !active.ta.value.trim()) cell = active; else if (vacia && vacia === state.cells[state.cells.length - 1]) cell = vacia; else cell = createCell("");
  cell.ta.value = code; cell.ta.dispatchEvent(new Event("input")); cell.ta.focus(); const hueco = code.indexOf("___"); if (hueco >= 0) cell.ta.setSelectionRange(hueco, hueco + 3); cell.el.scrollIntoView({ block: "center", behavior: "smooth" });
  if (run) runCell(cell);
  if (window.innerWidth <= 860) collapseSide(true);
}

function renderSesionNav() { const nav = $("#sesionNav"); nav.innerHTML = ""; for (const s of SESIONES) { const b = document.createElement("button"); b.textContent = `S${s.n}`; b.title = s.titulo; b.setAttribute("aria-pressed", s.n === state.sesion); b.onclick = () => { state.sesion = s.n; store.set("sesion", s.n); renderSesionNav(); renderMisiones(); loadNotebook(); }; nav.append(b); } }
/* ---------- Expedientes: dos formatos ----------
   · Formato clásico (sesiones 1, 2, 4 y 5): pistas con «Insertar» y un veredicto libre.
   · Formato «pensar antes de insertar» (sesión 3): predicción obligatoria, pasos que se abren
     en orden, esqueletos con espacios ___, decisiones con consecuencias, «cerraduras» que piden
     un número del resultado y un veredicto estructurado (decisión + evidencia + advertencia). */
const HOOKS = { acciones: null }; // (m, contenedor, obtenerTexto) => void · lo usa el modo servidor para «Enviar al profesor»
const skey = (m) => (m.sesion >= 3 ? "r2:" : "") + m.id;
const VER_OPC = ["Se sostiene", "Se sostiene en parte", "No se sostiene", "Los datos no alcanzan para decidir"];
const GATES = ["dec", "cer", "dato", "nota"];
const expState = (m) => store.get("exp:" + skey(m), {});
const expSave = (m, st) => store.set("exp:" + skey(m), st);
function hEl(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
function hBtn(label, cls = "") { const b = hEl("button", "btn small" + (cls ? " " + cls : ""), label); b.type = "button"; return b; }
function parseNum(s) { const t = String(s ?? "").trim().replace(/[\s%]/g, "").replace(",", "."); return t === "" ? NaN : Number(t); }
function gatesOf(p) { return Object.keys(p).filter((k) => GATES.includes(k)); }
function gateOk(p, s, g) {
  if (g === "dec") return !!s.decOk;
  if (g === "cer") return !!(s.cerOk || s.cerSalto);
  if (g === "dato") return !!(s.dato && String(s.dato).trim().length >= 1);
  if (g === "nota") return !!(s.nota && s.nota.trim().length >= 10);
  return true;
}
const pasoHecho = (p, s) => gatesOf(p).every((g) => gateOk(p, s || {}, g));
function expProgreso(m, st) { const req = m.pasos.filter((p) => !p.opcional); const n = req.filter((p, i) => pasoHecho(p, (st.pasos || {})[m.pasos.indexOf(p)])).length; return { n, total: req.length }; }

function radios(options, name, { tried = [], selected = null } = {}) {
  const box = hEl("div", "opts"); let value = selected;
  options.forEach((o, i) => {
    const lab = hEl("label"); const inp = document.createElement("input"); inp.type = "radio"; inp.name = name; inp.value = i;
    if (tried.includes(i)) { lab.classList.add("tried"); inp.disabled = true; }
    if (selected === i) inp.checked = true;
    inp.onchange = () => { value = i; };
    lab.append(inp, hEl("span", null, typeof o === "string" ? o : o.t)); box.append(lab);
  });
  return { el: box, value: () => value };
}
function aviso(cont, texto, tipo = "no") { const old = cont.querySelector(":scope > .fb.tmp"); if (old) old.remove(); const f = hEl("div", "fb tmp " + tipo, texto); cont.append(f); return f; }

  exp.onclick = () => { const txt = misiones.map((m) => `## ${m.id} ${m.titulo}\nHipótesis: ${m.hipotesis}\n${m.pasos ? (veredictoTexto(m) || "(sin terminar)") : "Veredicto: " + (store.get("veredictos", {})[skey(m)] || "(sin escribir)")}`).join("\n\n"); copyText(txt); exp.textContent = "Copiado ✓"; setTimeout(() => exp.textContent = "Copiar mis veredictos de esta sesión", 1500); };

function renderExpediente(m, body, d) {
  const st = expState(m); st.pasos = st.pasos || {};
  const save = () => expSave(m, st);
  const redraw = () => { const p = $("#panel-misiones"); const top = p.scrollTop; body.innerHTML = ""; renderExpediente(m, body, d); p.scrollTop = top; };
  const pr = expProgreso(m, st);
  $(".done", d).textContent = st.done ? "✓ resuelto" : st.pred === undefined ? "" : `${pr.n}/${pr.total}`;
  body.append(hEl("p", null, m.historia));
  const hip = hEl("div", "hip"); hip.append(hEl("b", null, "Hipótesis a poner a prueba"), document.createTextNode(m.hipotesis)); body.append(hip);

  // 1 · Predicción (abre los pasos)
  const pred = hEl("div", "gate pred");
  if (st.pred === undefined) {
    pred.append(hEl("div", "gt", "Tu apuesta"), hEl("div", "gq", m.prediccion.q));
    const r = radios(m.prediccion.op, "pred-" + m.id); const b = hBtn("Registrar mi predicción", "primary");
    b.onclick = () => { const v = r.value(); if (v === null) { aviso(pred, "Elige una opción: no hay respuesta incorrecta, pero tienes que apostar.", "neutral"); return; } st.pred = v; save(); redraw(); };
    pred.append(r.el, b, hEl("div", "small-note", "Tu predicción queda fija. Al final la compararás con lo que encontraste."));
    body.append(pred); return;
  }
  pred.append(hEl("div", "gt", "Tu predicción"), hEl("div", null, m.prediccion.op[st.pred])); body.append(pred);

  // 2 · Pasos (en orden)

    if (bloqueado) { card.classList.add("locked"); const ph = hEl("div", "ph"); ph.append(hEl("span", "k", String(i + 1)), hEl("span", "q", (p.opcional ? "Paso opcional" : "Paso bloqueado") + " · se abre al terminar el anterior")); card.append(ph); body.append(card); return; }
    const hecho = pasoHecho(p, ps);
    const ph = hEl("div", "ph"); ph.append(hEl("span", "k", String(i + 1)), hEl("span", "q", p.q)); if (hecho && gatesOf(p).length) ph.append(hEl("span", "ok", "✓")); card.append(ph);
    const inner = hEl("div", "inner"); const tools = hEl("div", "tools");
    if (p.pista) { const b = hBtn(ps.pista ? "Ocultar pista" : "Ver pista"); b.onclick = () => { ps.pista = !ps.pista; save(); redraw(); }; tools.append(b); }
    if (p.esq) { const b = hBtn("Insertar esqueleto"); b.title = "Inserta el código con espacios ___ que debes completar"; b.onclick = () => { ps.esq = (ps.esq || 0) + 1; save(); insertCode(p.esq); }; tools.append(b); }
    if (p.codigo) { const b = hBtn("Insertar código del colega"); b.onclick = () => insertCode(p.codigo); tools.append(b); }
    inner.append(tools);
    if (p.pista && ps.pista) inner.append(hEl("div", "pista-txt", p.pista));
    for (const g of gatesOf(p)) {
      const box = renderGate(m, p, ps, g, save, redraw); inner.append(box);
      if (!gateOk(p, ps, g)) break; // la siguiente compuerta del paso aparece al resolver esta
    }
    card.append(inner); body.append(card);
    if (!hecho && !p.opcional) bloqueado = true;
  });

  // 3 · Veredicto estructurado
  const v = hEl("div", "veredicto vered-box");
  if (bloqueado) { v.classList.add("locked"); v.append(hEl("div", "gt", "Tu veredicto"), hEl("div", "small-note", "Se abre cuando termines los pasos.")); body.append(v); return; }
  st.ver = st.ver || {}; const ver = st.ver;

  v.append(hEl("div", "gq", "La hipótesis…"), r.el);
  const area = (key, label, ph) => { const l = hEl("label", null, label); const ta = document.createElement("textarea"); ta.id = `v-${m.id}-${key}`; l.htmlFor = ta.id; ta.placeholder = ph; ta.value = ver[key] || ""; ta.addEventListener("input", () => { ver[key] = ta.value; save(); }); v.append(l, ta); };
  area("ev", "Evidencia", "Cita al menos un número de tu cuaderno que respalde tu decisión.");
  area("adv", "Advertencia", "¿Qué NO puedes afirmar con estos datos?");
  area("resp", "Respuesta", m.veredicto);

  row.append(mark);

function renderGate(m, p, ps, g, save, redraw) {
  const box = hEl("div", "gate " + g);
  if (g === "dec") {
    const dd = p.dec; box.append(hEl("div", "gq", dd.q));
    if (ps.decOk) { const o = dd.op[ps.decSel]; box.append(hEl("div", "chosen", "Elegiste: " + o.t)); box.append(hEl("div", "fb " + (o.ok ? "ok" : "neutral"), o.fb || dd.fb || "")); return box; }
    const tried = (ps.decHist || []).filter((i) => dd.op[i].ok === false);
    const r = radios(dd.op, `dec-${m.id}-${m.pasos.indexOf(p)}`, { tried }); box.append(r.el);
    if (tried.length) { const last = dd.op[tried[tried.length - 1]]; box.append(hEl("div", "fb no", last.fb + " Elige otra opción.")); }
    const b = hBtn("Decidir", "primary"); b.onclick = () => { const v = r.value(); if (v === null) { aviso(box, "Elige una opción.", "neutral"); return; } ps.decHist = [...(ps.decHist || []), v]; ps.decSel = v; ps.decOk = dd.op[v].ok !== false; save(); redraw(); };
    box.append(b); return box;
  }
  if (g === "cer") {
    const c = p.cer; box.append(hEl("div", "gt", "Para seguir, demuestra que lo leíste"), hEl("div", "gq", c.q));
    if (ps.cerOk) { const f = hEl("div", "fb ok"); f.append(hEl("b", null, `✓ ${fmtNum(ps.cerVal)}${c.unidad ? " " + c.unidad : ""}`)); if (c.despues) f.append(document.createTextNode(" · " + c.despues)); box.append(f); return box; }
    if (ps.cerSalto) { box.append(hEl("div", "fb neutral", "Seguiste sin resolverla. Vuelve a ella si te queda tiempo: tu veredicto lo dirá.")); const b = hBtn("Intentar de nuevo"); b.onclick = () => { ps.cerSalto = false; save(); redraw(); }; box.append(b); return box; }
    const row = hEl("div", "cer-row"); const inp = document.createElement("input"); inp.type = "text"; inp.inputMode = "decimal"; inp.placeholder = c.unidad === "%" ? "p. ej. 12,5" : "número"; inp.setAttribute("aria-label", c.q);
    const b = hBtn("Comprobar", "primary"); row.append(inp, b); if (c.unidad) row.append(hEl("span", "small-note", c.unidad)); box.append(row);
    const tries = ps.cerTries || 0;
    if (tries) box.append(hEl("div", "fb no", `No coincide con lo que da la base (${tries} ${tries === 1 ? "intento" : "intentos"}). ${c.ayuda || ""}`));
    if (tries >= 3) { const s = hBtn("Seguir sin resolver"); s.onclick = () => { ps.cerSalto = true; save(); redraw(); }; box.append(s); }
    const go = () => { const n = parseNum(inp.value); if (!isNum(n)) { aviso(box, "Escribe solo el número (puedes usar coma decimal).", "neutral"); return; } let ref; try { ref = CHECKS[c.calc](); } catch (e) { ref = NaN; } const cands = c.unidad === "%" && Math.abs(n) <= 1 && ref > 1 ? [n, n * 100] : [n]; ps.cerTries = tries + 1; if (cands.some((x) => Math.abs(x - ref) <= (c.tol ?? 0.01))) { ps.cerOk = true; ps.cerVal = cands.find((x) => Math.abs(x - ref) <= (c.tol ?? 0.01)); } save(); redraw(); };
    b.onclick = go; inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    return box;
  }
  if (g === "dato" || g === "nota") {
    const cfg = p[g]; box.append(hEl("div", "gq", cfg.q));
    const field = g === "dato" ? Object.assign(document.createElement("input"), { type: "text" }) : document.createElement("textarea");
    field.placeholder = cfg.ph || (g === "nota" ? "Escríbelo con tus palabras (una o dos frases)." : ""); field.value = ps[g] || ""; field.setAttribute("aria-label", cfg.q);
    const b = hBtn(gateOk(p, ps, g) ? "Actualizar" : "Guardar", "primary");
    b.onclick = () => { const v = field.value.trim(); if (g === "nota" && v.length < 10) { aviso(box, "Escribe al menos una frase.", "neutral"); return; } if (!v) return; ps[g] = v; save(); redraw(); };
    box.append(field, b); if (gateOk(p, ps, g)) box.append(hEl("span", "small-note", " ✓ guardado"));
    return box;
  }
  return box;
}

function faltantesVeredicto(m, st) {
  const v = st.ver || {}; const f = [];
  if (v.d === undefined || v.d === null) f.push("tu decisión sobre la hipótesis");
  if (!/\d/.test(v.ev || "")) f.push("evidencia con al menos un número");
  if ((v.adv || "").trim().length < 10) f.push("una advertencia");
  if ((v.resp || "").trim().length < 10) f.push("la respuesta a la pregunta");
  return f;
}
function veredictoTexto(m) {
  const st = expState(m); if (st.pred === undefined || faltantesVeredicto(m, st).length) return null;
  const L = [`PREDICCIÓN: ${m.prediccion.op[st.pred]}`];
  m.pasos.forEach((p, i) => {
    const s = (st.pasos || {})[i] || {};
    if (p.dec && s.decHist && s.decHist.length) { const malas = s.decHist.slice(0, -1).map((k) => `«${p.dec.op[k].t}»`); L.push(`Paso ${i + 1} · decisión: «${p.dec.op[s.decSel].t}»${malas.length ? ` (antes eligió ${malas.join(", ")})` : ""}`); }
    if (p.cer) L.push(`Paso ${i + 1} · número: ${s.cerOk ? `${fmtNum(s.cerVal)} (${s.cerTries} ${s.cerTries === 1 ? "intento" : "intentos"})` : s.cerSalto ? "sin resolver" : "pendiente"}`);
    if (p.dato && s.dato) L.push(`Paso ${i + 1} · ${p.dato.q} ${s.dato}`);
    if (p.nota && s.nota) L.push(`Paso ${i + 1} · nota: ${s.nota}`);
  });
  const v = st.ver; L.push(`VEREDICTO: ${VER_OPC[v.d]}`, `EVIDENCIA: ${v.ev.trim()}`, `ADVERTENCIA: ${v.adv.trim()}`, `RESPUESTA: ${v.resp.trim()}`);
  return L.join("\n").slice(0, 3900);
}

function renderRef() {

function parseFString(s, line) {

/* ---------- Revisión del código que propone la IA ----------
   Cada bloque se ejecuta en una copia del cuaderno; si falla, se le devuelve el error a la IA
   para que lo corrija (máximo 2 rondas) y se marca qué bloques quedaron probados. */
function bloquesDe(text) { return [...text.matchAll(/```([a-zA-Z]*)[ \t]*\n?([\s\S]*?)```/g)].map((m) => ({ raw: m[0], lang: m[1].toLowerCase(), code: m[2].trim() })); }
function cajaDeArena() { const g = new Map(); for (const [k, v] of state.globals) g.set(k, v instanceof DataFrame ? v.copy() : v); return g; }
function probarBloques(bl) {
  const g = cajaDeArena();
  return bl.map((b) => {
    if (b.lang && !["python", "py"].includes(b.lang)) return null;
    if (/___/.test(b.code)) return { estado: "esqueleto" };
    try { new Interpreter(g).run(b.code); return { estado: "ok" }; }
    catch (e) { return { estado: "error", error: (e && e.message ? e.message : String(e)) + (e && e.hint ? " Pista del laboratorio: " + e.hint : "") }; }
  });
}
function avisoIA(container, msg) { let n = container.querySelector(":scope > .ia-estado"); if (!n) { n = document.createElement("div"); n.className = "ia-estado"; container.append(n); } n.textContent = msg; }
async function revisarRespuesta(text, signal, onEstado) {
  if (!bloquesDe(text).length) return { text, estados: [] };
  for (let ronda = 0; ronda < 2; ronda++) {
    const bl = bloquesDe(text);
    if (onEstado) onEstado("Probando el código en el laboratorio…"); await new Promise((r) => setTimeout(r, 30));
    const est = probarBloques(bl);
    const malos = est.map((e, i) => [e, i]).filter(([e]) => e && e.estado === "error");
    if (!malos.length || !state.sample) return { text, estados: est };
    if (onEstado) onEstado("Ese código no funcionaba aquí; pidiendo a la IA que lo corrija…");
    for (const [e, i] of malos) {
      const prompt = `${LANG_REF()}\n\nPropusiste este código y FALLÓ al ejecutarlo en el laboratorio:\n\`\`\`python\n${bl[i].code}\n\`\`\`\nError del laboratorio: ${e.error}\n\nReescribe ese bloque para que funcione usando SOLO lo permitido arriba. Responde únicamente con el bloque \`\`\`python corregido, sin explicación.`;
      try { const { text: t2 } = await state.sample(prompt, { signal, modelTier: "default" }); const nb = bloquesDe(t2 || "")[0]; if (nb && nb.code) text = text.replace(bl[i].raw, "```python\n" + nb.code + "\n```"); }
      catch (err) { if (err && err.code === "cancelled") throw err; }
    }
  }

}

}
function makeRemoteSample() {
  const fn = async (input, opts = {}) => {
    try {
      const j = await apiJSON("/api/preguntar", { input, tier: opts.modelTier || "default", clase: store.get("clase", ""), dispositivo: deviceId() }, opts.signal);
      if (opts.onText) opts.onText({ text: j.text, delta: j.text });
      return { text: j.text, truncated: false, modelTierApplied: opts.modelTier || "default" };
    } catch (e) {
      if (e && e.name === "AbortError") throw { code: "cancelled", message: "cancelado" };
      if (e && e.code === "clave") throw { code: "upstream_error", message: e.message, text: "Clave de clase incorrecta o faltante. Escríbela en la pestaña «Analista IA»." };
      if (e && e.code === "rate_limited") throw e;
      throw { code: "upstream_error", message: (e && e.message) || "error", text: e && e.message ? e.message : "" };
    }
  };
  fn.json = async (input, opts) => JSON.parse((await fn(input, opts)).text);
  fn.limits = async () => ({ maxPromptBytes: 200000 });
  return fn;
}
initSample = async function () {
  try { if (window.claude && window.claude.use) { const s = await window.claude.use("sample"); if (s) { state.sample = s; updateAIButtons(); renderIA(); return; } } } catch {}
  try { const j = await apiJSON("/api/ping"); REMOTE.ok = true; REMOTE.ia = !!j.ia; REMOTE.clave = !!j.clave; } catch { REMOTE.ok = false; }
  if (REMOTE.ia) state.sample = makeRemoteSample();
  updateAIButtons(); renderIA(); renderMisiones();
};
const _renderIABase = renderIA;
renderIA = function () {
  _renderIABase();
  const p = $("#panel-ia");
  if (!REMOTE.ia) { if (REMOTE.ok) p.innerHTML = `<div class="notice">El asistente de IA no está configurado en este servidor. La pestaña «Códigos» tiene todos los comandos con ejemplos.</div>`; return; }
  if (REMOTE.clave) {
    const box = document.createElement("div"); box.className = "notice"; box.style.marginTop = "10px";
    box.innerHTML = `<label for="clave-clase" style="display:block;font-weight:600;margin-bottom:4px">Clave de la clase</label><div class="ask" style="margin:0"><input type="text" id="clave-clase" placeholder="la que te dio el profesor"><button class="btn small primary">Guardar</button></div>`;
    const inp = $("input", box); inp.value = store.get("clase", ""); $("button", box).onclick = () => { store.set("clase", inp.value.trim()); $("button", box).textContent = "Guardada ✓"; setTimeout(() => $("button", box).textContent = "Guardar", 1500); };
    p.prepend(box);
  }
};
const _renderMisionesBase = renderMisiones;
renderMisiones = function () {
  _renderMisionesBase();
  if (!REMOTE.ok) return;
  const p = $("#panel-misiones");
  const who = document.createElement("div"); who.className = "notice"; who.style.cssText = "margin:0 0 12px";
  who.innerHTML = `<label for="codigo-est" style="display:block;font-weight:600;margin-bottom:4px">Tu nombre o código de estudiante</label><input type="text" id="codigo-est" placeholder="p. ej. Ana Pérez o 2024-117" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)"><div style="font-size:12px;color:var(--muted);margin-top:4px">Con esto el profesor sabe de quién es cada veredicto. Pulsa «Enviar» en cada expediente cuando lo termines.</div>`;
  const inp = $("input", who); inp.value = store.get("codigo", ""); inp.addEventListener("input", () => store.set("codigo", inp.value));
  if (store.get("codigo_fijo", false)) { inp.readOnly = true; inp.style.opacity = ".75"; const ch = document.createElement("button"); ch.className = "btn small"; ch.textContent = "Cambiar"; ch.style.marginTop = "6px"; ch.onclick = () => { store.set("codigo_fijo", false); renderMisiones(); }; who.append(ch); who.querySelector("div").textContent = "Tus envíos quedan registrados con este nombre en este dispositivo. Si cambias de celular o computador, escribe exactamente el mismo nombre."; }
  p.insertBefore(who, p.children[2] || null);
};
/* Botón «Enviar al profesor» en cada expediente (lo pinta el núcleo a través de HOOKS.acciones). */
HOOKS.acciones = function (m, row, obtenerTexto) {
  if (!REMOTE.ok) return;
  const k = skey(m); const btn = document.createElement("button"); btn.className = "btn small"; btn.type = "button"; const sent = store.get("sent:" + k, null);
  btn.textContent = sent ? `Enviado ✓ ${sent}` : "Enviar al profesor";
  btn.onclick = async () => {
    const inp = $("#codigo-est"); const codigo = store.get("codigo", "").trim(); if (!codigo) { if (inp) { inp.focus(); inp.style.outline = "2px solid var(--danger)"; inp.scrollIntoView({ block: "center" }); } return; }
    const texto = obtenerTexto(); if (!texto) return;
    btn.disabled = true; btn.textContent = "Enviando…";
    try { await apiJSON("/api/veredictos", { codigo, dispositivo: deviceId(), id: m.id, sesion: m.sesion, titulo: m.titulo, hipotesis: m.hipotesis, veredicto: texto }); const t = new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }); store.set("sent:" + k, t); btn.textContent = `Enviado ✓ ${t}`; if (!store.get("codigo_fijo", false)) { store.set("codigo_fijo", true); if (inp) { inp.readOnly = true; inp.style.opacity = ".75"; } } }
    catch (e) { btn.textContent = "No se pudo enviar, reintentar"; }
    finally { btn.disabled = false; }
  };
  row.append(btn);
};

function deviceId() { let id = store.get("dispositivo", null); if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).slice(0, 36); store.set("dispositivo", id); } return id; }

/* ---------- Panel del profesor (dentro del laboratorio) ---------- */
function abrirProfesor() {
  let modal = $("#modal-prof");
  if (!modal) {
    modal = document.createElement("div"); modal.id = "modal-prof";
    modal.style.cssText = "position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto";
    modal.innerHTML = `<div style="background:var(--surface);color:var(--ink);border-radius:10px;max-width:1100px;width:100%;padding:16px 18px;box-shadow:var(--shadow)">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;font-family:var(--display);font-size:22px">Veredictos de los estudiantes</h2><span class="spacer" style="flex:1"></span><button class="btn small" id="prof-cerrar">Cerrar</button></div>
      <div class="ask" style="margin-top:10px;flex-wrap:wrap"><input type="password" id="prof-clave" placeholder="Clave de profesor" style="max-width:220px"><button class="btn small primary" id="prof-cargar">Entrar</button><select id="prof-ses" class="btn small"><option value="">Todas las sesiones</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><input type="text" id="prof-filtro" placeholder="Filtrar por nombre" style="max-width:220px"><button class="btn small" id="prof-csv" disabled>Descargar CSV</button></div>
      <div id="prof-err" class="err" style="margin-top:8px" hidden></div>
      <div id="prof-stats" style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0"></div>
      <div class="tbl-wrap" style="max-height:62vh;overflow:auto"><table class="df" id="prof-tabla" hidden><thead><tr><th class="idx">Estudiante</th><th class="idx">Expediente</th><th class="idx">Veredicto</th><th class="idx">Fecha</th></tr></thead><tbody></tbody></table></div></div>`;
    document.body.append(modal);
    let datos = null;
    const render = () => { if (!datos) return; const ses = $("#prof-ses").value, q = $("#prof-filtro").value.trim().toLowerCase(); const rows = datos.veredictos.filter((v) => (!ses || String(v.sesion) === ses) && (!q || v.codigo.toLowerCase().includes(q))).sort((a, b) => a.codigo.localeCompare(b.codigo, "es") || a.id.localeCompare(b.id)); const est = new Set(rows.map((v) => v.clave_est || v.codigo.toLowerCase())); $("#prof-stats").innerHTML = [["estudiantes", est.size], ["veredictos (último por expediente)", rows.length], ["envíos en total", datos.total]].map(([l, n]) => `<div class="stat" style="padding:8px 14px;min-width:150px"><b style="font-size:22px;color:var(--accent)">${n}</b><br><span style="color:var(--muted);font-size:12px">${l}</span></div>`).join(""); const tb = $("#prof-tabla tbody"); tb.innerHTML = ""; for (const v of rows) { const tr = document.createElement("tr"); const td = (t, cls) => { const c = document.createElement("td"); c.className = cls || "txt"; c.textContent = t; c.style.whiteSpace = cls === "wrap" ? "pre-wrap" : "nowrap"; if (cls === "wrap") { c.style.maxWidth = "520px"; c.className = "txt"; } return c; }; tr.append(td(v.codigo), td(`${v.id} · ${v.titulo}`), td(v.veredicto, "wrap"), td(new Date(v.fecha).toLocaleString("es-CO"))); tb.append(tr); } $("#prof-tabla").hidden = false; };
    $("#prof-cargar").onclick = async () => { $("#prof-err").hidden = true; try { datos = await apiJSON("/api/veredictos?clave=" + encodeURIComponent($("#prof-clave").value.trim())); $("#prof-csv").disabled = false; render(); } catch (e) { $("#prof-err").textContent = e.message || "No se pudo cargar."; $("#prof-err").hidden = false; } };
    $("#prof-clave").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#prof-cargar").onclick(); });
    $("#prof-ses").onchange = render; $("#prof-filtro").oninput = render;
    $("#prof-csv").onclick = () => { if (!datos) return; const cols = ["codigo", "sesion", "id", "titulo", "hipotesis", "veredicto", "fecha", "dispositivo"]; const q = (x) => '"' + String(x ?? "").replace(/"/g, '""') + '"'; const lines = [cols.join(","), ...datos.historial.map((v) => cols.map((c) => q(v[c])).join(","))]; const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" })); a.download = "veredictos.csv"; a.click(); };
    $("#prof-cerrar").onclick = () => { modal.hidden = true; };
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.hidden = true; });
  }
  modal.hidden = false; $("#prof-clave").focus();
}
(function () { const nav = $("#sesionNav"); if (!nav) return; const b = document.createElement("button"); b.className = "btn small"; b.id = "profBtn"; b.textContent = "Profesor"; b.title = "Ver los veredictos enviados (requiere clave)"; b.onclick = abrirProfesor; nav.parentElement.insertBefore(b, nav); })();

</script>
